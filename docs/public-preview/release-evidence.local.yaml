    rotation and uncertain-submit retry blocking.'
  - Nuxt production build passed with CMS prerender deliberately disabled.
  limitations:
  - This proves compilation of the frontend, not real CMS route prerender or a production frontend deployment.
- id: ZITADEL-LIVE
  status: pass
  command: go test -race -tags=integration -modfile=<SITE_CANDIDATE_MODFILE> -run TestOIDCLivePostgresHostAcceptance
    -count=1 -v ./internal/interfaces/http/fiber/handlers/oidcdemo
