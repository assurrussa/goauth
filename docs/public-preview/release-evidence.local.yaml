    passed.
  - Root coverage 83.9%, PostgreSQL 80.7%; required package coverage gates passed.
  - 'govulncheck: no reachable vulnerabilities; three findings in required modules were not reachable
    from imported packages/calls.'
  - Actual disposable pg_dump/pg_restore and Chromium/HTTPS gates passed on the final source.
  limitations:
  - This is an unpublished local candidate, not anonymous installation of a published tag.
- id: PASSWORD-FUZZ
  status: pass
  command: go test -run '^$' -fuzz '^FuzzArgon2PHCBounds$' -fuzztime=10s -parallel=2 .
  observations:
  - 467499 executions; malformed PHC bounds did not panic or accept invalid narrowed parameters.
  limitations:
  - A bounded fuzz run is not an exhaustive proof.
- id: ADMIN-GATE
  status: pass
  command: make check GOAUTH_LOCAL_PATH=<GOAUTH_CHECKOUT> PROJECT_GOMODCACHE=<LOCAL_CACHE>
  inputs:
  - GOFLAGS selects a temporary candidate modfile; no persistent local replacement was committed.
  observations:
  - Formatting, vet, lint, whole-module race/coverage, clean temporary consumer, resource manifest/unit
    tests, ESLint/Prettier, typecheck and production resource build passed.
- id: ADMIN-REAL-STATE
  status: pass
  command: go test -race -tags=integration -modfile=<ADMIN_CANDIDATE_MODFILE> -run 'Test(PostgresAdminOpaqueRefreshAndRevocation|Redis|Postgres|ConcurrentAdminRefreshAcrossInstancesAndStaleSessionSave|AdminCSRFOriginAndOpaqueBinding|CSRFToken)'
    -count=1 ./services/adminservice ./bootstrap ./internal/auth/browserstate
  inputs:
  - Explicit disposable local PostgreSQL/Redis variables; no production service.
  observations:
  - Independent connections/instances produce one refresh consumer. Wrong owner/stale version cannot complete.
    Redis TTL is retained and stored credentials are encrypted.
  - Stale Fiber snapshot cannot restore credentials; opaque rotation fences old credential. Actual permission/membership
    removal and logout-all deny the next host request.
- id: SITE-SCOPED
  status: pass
  command: go test -race -modfile=<SITE_CANDIDATE_MODFILE> -count=1 ./internal/auth ./internal/app ./internal/interfaces/outbox
  observations:
  - Explicit online/offline verification, notification individual receipt checks, legacy expiry rejection
    and DI assembly compiled/passed.
- id: SITE-HTTPS-PG
  status: pass
  command: BROWSER_AUTH_POSTGRES_HTTPS=1 go test -race -tags=integration -modfile=<SITE_CANDIDATE_MODFILE>
    -run TestPostgresHTTPSFullAuthLifecycle -count=1 -v ./internal/interfaces/http/fiber/handlers/v1/auth
  inputs:
  - Explicit disposable BROWSER_AUTH_PG_DSN, installed Chromium and Playwright.
  observations:
  - Same-origin and split API/browser full account lifecycles passed with real host adapter, canonical
    PostgreSQL Runtime and native encrypted notification worker.
  - Signup, delivered confirmation, login/me, two tabs with one submitted refresh, logout/all, delivered
    password reset, password change and delivered email change/confirmation passed.
  - Native endpoint lifecycle uses explicit JSON/Bearer, rejects Cookie and emits no Set-Cookie. Hostile
    sibling/Origin, duplicate/conflicting credentials and cookie flags checked.
  - Fresh uniquely named database removed; existing integration database retained.
- id: EXAMPLE-HTTPS-PG
  status: pass
  command: make browser-acceptance
  observations:
  - Actual public nethttp example/app.js with canonical PostgreSQL/native worker passed HTTPS account
    lifecycle, genuine access expiry and exactly one refresh across two tabs.
  - HttpOnly host cookies, hostile Origin/CSRF, duplicate/conflicting credentials and bearer API isolation
    passed.
  - Explicit invocation without a browser engine failed instead of passing/skipping.
- id: BACKUP-RESTORE
  status: pass
  command: make backup-restore-check
  observations:
  - Actual dump/restore of a new disposable database preserved schema, canonical session and encrypted
    pending notification. Retained key versions decrypted delivery, then controlled logout-all revoked
    restored session.
  limitations:
  - No production database grants, WAL erasure or deployment recovery were certified.
- id: FRONTEND
  status: pass
  command: npm run lint && npm run typecheck && node --test scripts/browser-session.test.mjs; NUXT_DISABLE_PRERENDER=1
    NUXT_ENABLE_DYNAMIC_PRERENDER=0 npm run build
  observations:
