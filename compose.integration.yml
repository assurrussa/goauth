services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: goauth_integration
      POSTGRES_USER: goauth
      POSTGRES_PASSWORD: goauth
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goauth -d goauth_integration"]
      interval: 1s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
