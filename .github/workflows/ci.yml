name: CI

# Hosted verification is opt-in; run this workflow manually for a selected ref.
on:
  workflow_dispatch:
    inputs:
      validation_scope:
        description: Validation scope
        required: true
        type: choice
        default: full
        options:
          - full
          - fixtures

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: goauth_integration
          POSTGRES_USER: goauth
          POSTGRES_PASSWORD: goauth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U goauth -d goauth_integration"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    env:
      GOAUTH_TEST_POSTGRES_DSN: postgres://goauth:goauth@127.0.0.1:5432/goauth_integration?sslmode=disable
      GOAUTH_TEST_REDIS_ADDRESS: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install formatting tools
        run: |
          go install mvdan.cc/gofumpt@v0.11.0
          go install github.com/daixiang0/gci@v0.14.0
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          install-only: true
      - name: Changed integration-tagged source lint
        run: |
          base="$(git merge-base HEAD origin/master)"
          printf 'Tagged lint comparison: base=%s head=%s\n' "$base" "$(git rev-parse HEAD)"
          golangci-lint run --build-tags=integration --new-from-rev="$base" --whole-files --timeout=5m ./postgres
      - name: Runtime and RBAC benchmark smoke
        run: |
          go version
          go test ./testkit -run='^$' -bench='^BenchmarkRuntimeHotPaths$' -benchtime=12x -count=1 -cpu=1 -benchmem
          go test ./rbac -run='^$' -bench='^BenchmarkCheck$' -benchtime=12x -count=1 -cpu=1 -benchmem
      - name: Focused PostgreSQL fixture race tests
        if: ${{ inputs.validation_scope == 'fixtures' }}
        run: |
          echo 'Focused fixture mode: full unit, integration, aggregate coverage, and vulnerability gates are not run.'
          go test -v -race -tags=integration -run='^(TestCleanupBatch|TestPostgresRBACIndependentHandlesUseAuthoritativePermissions)' -count=1 ./postgres
      - name: Canonical unit and public API gate
        if: ${{ inputs.validation_scope != 'fixtures' }}
        run: make check
      - name: PostgreSQL and Redis integration gate
        if: ${{ inputs.validation_scope != 'fixtures' }}
        run: make integration
      - name: Aggregate coverage profile
        if: ${{ inputs.validation_scope != 'fixtures' }}
        run: make coverage-aggregate
      - name: Reachable vulnerability gate
        if: ${{ inputs.validation_scope != 'fixtures' }}
        run: make vulnerability-check
