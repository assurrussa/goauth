name: Public module verification

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact existing tag containing the public-module-check target'
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-public-module:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate public-release request
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REPOSITORY_PRIVATE" != "false" ]]; then
            echo "::error::The repository is private. This workflow verifies publication; it does not change visibility."
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[[:alnum:].-]+)?$ ]]; then
            echo "::error::Supply an exact version tag, not a branch or latest."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify exact tag and anonymous external consumer
        run: make public-module-check
